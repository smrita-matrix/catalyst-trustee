; Upload limits for this site.
;
; The default on most shared hosting is 2M, which is too small for the PDFs and
; images uploaded through the dashboard - a notice document or a banner easily
; exceeds it, and the upload is refused before the site ever sees the file.
;
; Read by PHP running as CGI/FastCGI, which is what cPanel hosting normally
; uses. Changes can take a few minutes to apply (PHP caches this file).
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 50
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
